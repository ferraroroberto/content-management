# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-pipe"
icon        = "📝"
description = "Content surfaces: reporting, planning, newsletter, podcast and video."
tag         = ["→", "Notion"]
depends_on  = ["local-llm-hub"]

# Repo layout (project-scaffolding docs/repo-layout.md): a multi-tool pipeline-cli
# repo keeps one root package per tool, so each tool folder below is a declared
# root, not drift. docs/layout.md says what each one holds.
shape       = "pipeline-cli"
extra_roots = [
    "app",
    "check_ip",
    "demo_video",
    "engagement",
    "newsletter",
    "planning",
    "podcast",
    "recorder",
    "reporting",
]

# Reviewed false positive: the docstring names the old location this module was
# migrated from; nothing is read from that path at runtime or build time.
[contracts]
ignore_refs = [
    { path = "newsletter/build_newsletter.py", repo = "automation", why = "docstring provenance note naming the legacy script path, not a runtime or build-time read" },
    { path = "newsletter/normalize_names.py", repo = "automation", why = "docstring provenance note naming the legacy script path, not a runtime or build-time read" },
    { path = "newsletter/normalize_url.py", repo = "automation", why = "docstring provenance note naming the legacy script path, not a runtime or build-time read" },
]

# Vendored byte-for-byte from project-scaffolding. sha = the source repo commit
# the copy was taken from; /propagate-vendored hash-verifies + bumps.
[vendored]
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/comment_ratchet.py" }
static_ratchet  = { src = "scripts/static_ratchet.py",  sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/static_ratchet.py" }
docs_ratchet    = { src = "scripts/docs_ratchet.py",    sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/docs_ratchet.py" }
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/structure_ratchet.py" }
structure_layout = { src = "scripts/structure_layout.py", sha = "713b1d1e36989440679ec4e415ff149b14d96c81", dest = "scripts/structure_layout.py" }
structure_band = { src = "scripts/structure_band.py", sha = "3b708fd3c54ab7b93b08d489406c405762c83c41", dest = "scripts/structure_band.py" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/doc_refs_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/dead_code_ratchet.py" }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/conventions_ratchet.py" }
runtime_write_ratchet = { src = "scripts/runtime_write_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/runtime_write_ratchet.py" }
runtime_write_resolve = { src = "scripts/runtime_write_resolve.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/runtime_write_resolve.py" }
rec-wave = { src = "app/webapp/static/_vendored/rec-wave", sha = "35c1f11348e100fa6b5da487411424c6d6ced43c", dest = "recorder/static/_vendored/rec-wave" }

# Comment ratchet (project-scaffolding docs/comment-ratchet.md): fails the pre-ship
# gate when a file's count of `#NNN` issue references inside comments rises above
# the baseline, never on the baselined debt — a comment states the present-tense
# why, not the change's history. src/gmail_readonly/ and src/google_oauth_common/
# are vendored copies, so they are excluded like the static ratchet above.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"
exclude  = ["src/gmail_readonly/**", "src/google_oauth_common/**"]

# Static-analysis ratchet (project-scaffolding docs/static-ratchet.md): fails the
# pre-ship gate on a new duplicate block, unused import/variable or curated ruff bug
# (B) / security (S) finding, never on the baselined debt. src/gmail_readonly/ and
# src/google_oauth_common/ are vendored copies (duplicates of their source repo by
# design), so they cannot be fixed here.
[static_ratchet]
enabled    = true
baseline   = ".static-ratchet-baseline.json"
min_lines  = 10
min_tokens = 100
exclude    = ["src/gmail_readonly/**", "src/google_oauth_common/**"]

# Docs ratchet (project-scaffolding docs/docs-ratchet.md): fails the pre-ship gate
# when README.md grows past 40 KiB or its baselined size, or when README.md or an
# included doc gains an issue reference, dated heading or changelog heading.
# `include` adds every per-folder README — otherwise they read as change logs
# with no structural check ever catching it.
# docs/ holds hand-written reference only (no generated or dated report folders),
# so nothing is excluded.
[docs_ratchet]
enabled          = true
baseline         = ".docs-ratchet-baseline.json"
readme_max_bytes = 40960
include = [
    "README.md",
    "docs/",
    "check_ip/README.md",
    "config/README.md",
    "demo_video/README.md",
    "engagement/README.md",
    "newsletter/README.md",
    "planning/instagram/README.md",
    "planning/linkedin/README.md",
    "planning/substack/README.md",
    "planning/threads/README.md",
    "planning/twitter/README.md",
    "planning/videos/README.md",
    "podcast/README.md",
    "recorder/README.md",
    "reporting/notion/README.md",
    "reporting/process/README.md",
    "reporting/social_client/README.md",
]

# Structure ratchet (project-scaffolding docs/structure-ratchet.md): fails the
# pre-ship gate when a file passes 1,000 lines, a function 100 lines or a
# directory 40 modules and is new or above its baselined size, or when the root
# folders stop matching `shape` + `extra_roots`. src/gmail_readonly/ and
# src/google_oauth_common/ are vendored copies, so they are excluded like the other
# ratchets above.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"
exclude  = ["src/gmail_readonly/**", "src/google_oauth_common/**"]

# Instruction ratchet (project-scaffolding docs/instruction-ratchet.md): fails the
# pre-ship gate when a count of the weekly prompt audit's deterministic rule hits
# in an instruction file (CLAUDE.md, AGENTS.md, .claude/rules, every SKILL.md and
# the docs a skill links to) rises above the baseline, or a file passes its size
# cap. Existing hits are baselined, never excluded.
[instruction_ratchet]
enabled    = true
baseline   = ".instruction-ratchet-baseline.json"
skill_dirs = [".claude/skills"]

# Doc references ratchet (project-scaffolding docs/doc-refs-ratchet.md): fails the
# pre-ship gate when README.md, CLAUDE.md or docs/**/*.md names a repo path, a
# `python -m` module or a relative link that does not exist, beyond the baseline.
# No `port` is declared above, so loopback ports are not checked.
[doc_refs_ratchet]
enabled    = true
baseline   = ".doc-refs-ratchet-baseline.json"
include    = ["README.md", "CLAUDE.md", "docs/"]
allow_refs = []

# Dead code ratchet (project-scaffolding docs/dead-code-ratchet.md): fails the pre-ship
# gate when a new function, class or method appears that nothing in the repo refers
# to, beyond the baseline. src/gmail_readonly/ and src/google_oauth_common/ are
# vendored copies that must stay byte-identical to whatsapp-radar, so their unused API belongs
# to that repo: excluded from reporting, still read for references. They sit outside
# [vendored] because that table tracks project-scaffolding copies by commit sha.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"
exclude  = ["src/gmail_readonly/**", "src/google_oauth_common/**"]

# Conventions ratchet (project-scaffolding docs/conventions-ratchet.md): fails the
# pre-ship gate when a file's count of hits for an enabled fleet-convention rule rises
# above the baseline. no-window: the repo runs on Windows and spawns subprocesses.
# logging-not-print and no-drive-path: it is library code. secret-compare and
# git-wrapper stay off because the repo has no helper for either. Nothing is excluded:
# the vendored src/gmail_readonly/ and src/google_oauth_common/ copies carry no hits.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "logging-not-print", "no-drive-path"]
# the default print_paths (app/, src/) would skip every library package but app/
print_paths = ["app/", "check_ip/", "config/", "demo_video/", "engagement/", "newsletter/", "planning/", "podcast/", "recorder/", "reporting/"]

# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .runtime-write-ratchet-baseline.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled  = true
baseline = ".runtime-write-ratchet-baseline.json"
# The tool packages (the extra_roots above) are this repo's code, beside src/, scripts/
# and config/; src/gmail_readonly/ and src/google_oauth_common/ are vendored copies.
code_folders = ["src", "scripts", "config", "app", "check_ip", "demo_video", "engagement",
                "newsletter", "planning", "podcast", "recorder", "reporting"]
exclude      = ["src/gmail_readonly/**", "src/google_oauth_common/**"]
